# CI de Analítica 360 (apps/api, apps/web y apps/tienda).
# - En cada PR y push: lint, tipos, tests y build de la API; lint y tipos de la web; lint, tipos y tests de la tienda.
# - Si eso pasa: compila las imágenes de Docker (api, migrate, web).
# - En push a main: además las publica en GitHub Container Registry (ghcr.io).
#
# Configurar en GitHub → Settings → Secrets and variables → Actions:
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WHATSAPP_CONTACT (opcional)
#   Secrets:   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # usa la versión de "packageManager" del package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Solo las apps nuevas y sus dependencias (la raíz tiene el sistema viejo).
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --filter api... --filter web... --filter tienda...

      - name: API · cliente de Prisma
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: API · lint
        run: pnpm --filter api lint

      - name: API · tests
        run: pnpm --filter api test

      - name: API · build
        run: pnpm --filter api build

      - name: Web · lint
        run: pnpm --filter web lint

      - name: Web · tipos
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Tienda · lint
        run: pnpm --filter tienda lint

      - name: Tienda · tipos
        run: pnpm --filter tienda typecheck

      - name: Tienda · tests
        run: pnpm --filter tienda test

  imagenes:
    name: Imágenes Docker
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a ghcr.io
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de las imágenes
        id: nombres
        run: |
          base="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/analitica-360"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ steps.nombres.outputs.base }}-api:${{ steps.nombres.outputs.sha }}
            ${{ steps.nombres.outputs.base }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ steps.nombres.outputs.base }}-migrate:${{ steps.nombres.outputs.sha }}
            ${{ steps.nombres.outputs.base }}-migrate:latest
          cache-from: type=gha,scope=api

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WHATSAPP_CONTACT=${{ vars.NEXT_PUBLIC_WHATSAPP_CONTACT }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.nombres.outputs.base }}-web:${{ steps.nombres.outputs.sha }}
            ${{ steps.nombres.outputs.base }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
