<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="fav-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c9" />
      <stop offset="60%" stop-color="#00d2b4" />
      <stop offset="85%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="fav-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c9" />
      <stop offset="100%" stop-color="#00d2b4" />
    </linearGradient>
    <linearGradient id="fav-leg-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5c9" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="fav-leg-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2b4" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Arco posterior del anillo 360 -->
  <path
    d="M 20,54 A 42 14.5 0 0 1 100,54"
    stroke="url(#fav-ring)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Vértice superior de la 'A' -->
  <path
    d="M 43,51 L 60,18 C 60.5,17 61.5,17 62,18 L 79,51"
    stroke="url(#fav-apex)"
    stroke-width="12.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pata izquierda de la 'A' -->
  <path
    d="M 42,56 L 31,84"
    stroke="url(#fav-leg-left)"
    stroke-width="12.5"
    stroke-linecap="round"
  />

  <!-- Pata derecha de la 'A' -->
  <path
    d="M 78,56 L 89,84"
    stroke="url(#fav-leg-right)"
    stroke-width="12.5"
    stroke-linecap="round"
  />

  <!-- Arco frontal del anillo 360 -->
  <path
    d="M 20,54 A 42 14.5 0 0 0 100,54"
    stroke="url(#fav-ring)"
    stroke-width="12"
    stroke-linecap="round"
  />
</svg>