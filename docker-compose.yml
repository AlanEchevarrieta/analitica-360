services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: analitica360
      POSTGRES_USER: analitica360
      POSTGRES_PASSWORD: analitica360_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitica360 -d analitica360"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Desactivado por defecto: MinIO dejó de publicar imágenes en Docker Hub
    # y quay.io (pull denegado), y todavía ningún módulo lo usa (Fase 6).
    # Reemplazar por una alternativa S3 (ej. RustFS/SeaweedFS) al implementar
    # storage. Para levantarlo igual: docker compose --profile storage up -d
    profiles: ["storage"]
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: analitica360
      MINIO_ROOT_PASSWORD: analitica360_dev
    ports:
      - "9000:9000" # API S3-compatible
      - "9001:9001" # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Apps dockerizadas (perfil "apps") -------------------------------------
  # Sin perfil, `docker compose up -d` sigue levantando solo la base (desarrollo).
  # Todo en Docker, contra esta misma base y la misma carpeta de fotos:
  #   docker compose --profile apps --env-file .env.docker up -d --build
  # (o el acceso directo "Levantar Analitica Docker" del Escritorio).
  migrate:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: analitica360-api-migrate
    environment:
      DATABASE_URL: postgresql://analitica360:analitica360_dev@postgres:5432/analitica360?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: analitica360-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://analitica360:analitica360_dev@postgres:5432/analitica360?schema=public
      CORS_ORIGINS: http://localhost:3000,http://localhost:3010,http://localhost:3002
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-}
      TIENDA_PROXY_KEY: ${TIENDA_PROXY_KEY:-}
      TIENDA_DOMINIO_BASE: ${TIENDA_DOMINIO_BASE:-analitica360.app}
      # Las fotos guardadas en la base apuntan a http://localhost:3001/archivos/...
      ARCHIVOS_URL_PUBLICA: http://localhost:3001/archivos
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AVISOS_EMAIL: ${AVISOS_EMAIL:-}
    volumes:
      # La misma carpeta de fotos que usa la API en desarrollo.
      - ./apps/api/uploads:/data/archivos
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_WHATSAPP_CONTACT: ${NEXT_PUBLIC_WHATSAPP_CONTACT:-}
        NEXT_PUBLIC_TIENDA_LOCAL_URL: ${NEXT_PUBLIC_TIENDA_LOCAL_URL:-}
    image: analitica360-web
    restart: unless-stopped
    environment:
      API_URL_INTERNA: http://api:3001
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  tienda:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/tienda/Dockerfile
    image: analitica360-tienda
    restart: unless-stopped
    environment:
      ANALITICA_API_URL: http://api:3001
      ANALITICA_TIENDA_KEY: ${TIENDA_PROXY_KEY:-}
    ports:
      - "3010:3010"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
