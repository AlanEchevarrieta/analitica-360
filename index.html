<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080C14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Analítica 360" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Analítica 360 — Sistema de gestión para comercios</title>
    <meta
      name="description"
      content="Registrá ventas, controlá stock y conocé tus clientes desde el celular. Probalo gratis 14 días."
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0f1b2d;
        color: #f1f5f9;
      }
      @keyframes spin {
        from {
          transform: translateZ(0) rotate(0deg);
        }
        to {
          transform: translateZ(0) rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://noawemhzmlnjrbkmztjs.supabase.co" />
    <link rel="dns-prefetch" href="https://noawemhzmlnjrbkmztjs.supabase.co" />
    <script>
      try {
        if (localStorage.getItem('analitica-tema') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Karla:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Karla:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
